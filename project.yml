name: AIUsage
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # 通用二进制：同时支持 Apple Silicon 与 Intel
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
schemes:
  AIUsage:
    build:
      targets:
        AIUsage: all
      postActions:
        # 构建完成后按需导出。脚本本身会在「没配输出目录」时直接跳过，
        # 所以对没有配置的人（以及 clone 下来第一次构建的人）这一步是空操作。
        # 配法见 scripts/export.sh 头部说明。
        - name: Export build
          settingsTarget: AIUsage
          script: |
            "${SRCROOT}/scripts/export.sh" "${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}" "${MARKETING_VERSION}"
    run:
      config: Debug
    archive:
      config: Release
targets:
  AIUsage:
    type: application
    platform: macOS
    sources:
      - path: AIUsage
    entitlements:
      path: AIUsage/AIUsage.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    info:
      path: AIUsage/Info.plist
      properties:
        CFBundleName: AI Usage
        CFBundleDisplayName: AI Usage
        # 图标由 Assets.xcassets/AppIcon 编译成 AppIcon.icns，这两个键让 Dock/Finder 找得到它。
        # actool 一般会自动注入，但这里是手写 Info.plist（GENERATE_INFOPLIST_FILE=NO），显式写上更稳。
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.aiusage
        PRODUCT_NAME: AI Usage
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
